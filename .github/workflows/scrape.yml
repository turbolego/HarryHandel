name: Scrape Food Prices

on:
  schedule:
    - cron: '0 2 * * 0' # Weekly on Sunday at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 pandas
          playwright install chromium

      - name: Run scraper
        run: |
          cd src
          python -m scrapers.main
          # Copy data to repo root for GitHub Pages
          cp src/data/prices.json data/prices.json

      - name: Generate fallback data if no products found
        if: failure() || steps.scraper.outcome == 'skipped'
        # This step runs only if the scraper didn't find products or failed
        run: python3 generate_fallback_data.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Update food prices $(date +'%Y-%m-%d')"
          git push
